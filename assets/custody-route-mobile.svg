<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1100" role="img" aria-labelledby="title desc"><title id="title">Custody and usable funds are different stages</title><desc id="desc">Original assets can remain in custody while a separate trading ledger records exposure and unsettled profit. Before a payout, settlement, release conditions, transfer completion and the required asset must all be checked. The mirror is not another asset.</desc><rect width="100%" height="100%" fill="#f8f7f2"/><g font-family="Arial,Helvetica,sans-serif" fill="#192d2b"><text x="18" y="34" font-size="24" font-weight="700">Where it sits is not</text><text x="18" y="64" font-size="24" font-weight="700">when it can pay.</text><rect x="18" y="96" width="364" height="153" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="36" y="130" font-size="21" font-weight="700">Original asset in custody</text><text x="36" y="164" font-size="17">May be locked or pledged.</text><text x="36" y="191" font-size="17">Custody is not unrestricted access.</text><path d="M200 254V290m-6 -8l6 8l6 -8" stroke="#235e51" stroke-width="2" stroke-dasharray="6 4" fill="none"/><text x="18" y="278" font-size="15">Mirror, not a second asset</text><rect x="18" y="302" width="364" height="151" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="36" y="336" font-size="21" font-weight="700">Exchange trading record</text><text x="36" y="370" font-size="17">PnL can remain unsettled.</text><text x="36" y="397" font-size="17">Exchange collateral and completed</text><text x="36" y="424" font-size="17">instructions affect settlement.</text><text x="18" y="498" font-size="21" font-weight="700">Before a payment, check:</text><rect x="18" y="519" width="364" height="98" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="36" y="553" font-size="21" font-weight="700">1. Settlement</text><text x="36" y="587" font-size="17">Relevant currency and status.</text><rect x="18" y="635" width="364" height="98" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="36" y="669" font-size="21" font-weight="700">2. Release</text><text x="36" y="703" font-size="17">Encumbrance and account scope.</text><rect x="18" y="751" width="364" height="98" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="36" y="785" font-size="21" font-weight="700">3. Transfer</text><text x="36" y="819" font-size="17">Completion, not just an order ID.</text><rect x="18" y="867" width="364" height="98" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="36" y="901" font-size="21" font-weight="700">4. Final asset</text><text x="36" y="935" font-size="17">What arrives before the deadline.</text><text x="18" y="1009" font-size="17" font-weight="700">A timely free buffer can bridge a delay.</text><text x="18" y="1036" font-size="17">A reserve on the blocked route may not.</text><text x="18" y="1073" font-size="15">Source map, not a live balance or guarantee.</text></g></svg>
