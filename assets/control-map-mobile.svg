<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 890" role="img" aria-labelledby="title desc"><title id="title">Control map: measured links and the missing link</title><desc id="desc">September 11, 2026 snapshot. Development Safe returns five required signatures and ten owners. Its role link to the observed owner controller is not proved. Owner getters for USDe and Mint V2 return e8dc…7c94. USDe minter getter returns Mint V2. Solid arrows are measured getter relationships; dashed relationship is unresolved.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#235e51"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#192d2b}.small{font-size:16px;fill:#536460}.label{font-size:22px;font-weight:700}.number{font-family:Georgia,serif;font-size:31px}.box{fill:#f8f7f2;stroke:#b7c4b8;stroke-width:1.5}.solid{fill:none;stroke:#235e51;stroke-width:2.4;marker-end:url(#arrow)}.dash{fill:none;stroke:#9c6a32;stroke-width:2.4;stroke-dasharray:7 6}.amber{fill:#805323}</style><rect width="400" height="890" fill="#efefe7"/>
<text x="24" y="29" class="small">11 SEPTEMBER 2026 • ETHEREUM</text><text x="24" y="54" class="small">Block 25,952,841</text>
<rect class="box" x="54" y="83" width="322" height="132" rx="4"/><text x="73" y="118" class="label">Development Safe</text><text x="73" y="160" class="number">5 of 10 approvals</text><text x="73" y="192" class="small">0x3b0a…1862</text>
<path class="dash" d="M218 215 V275"/><text x="54" y="247" class="small amber">Role link</text><text x="54" y="270" class="small amber">not yet proved</text>
<rect class="box" x="54" y="285" width="322" height="140" rx="4"/><text x="73" y="320" class="label" style="font-size:20px">Observed owner controller</text><text x="73" y="360" class="number">0xe8dc…7c94</text><text x="73" y="391" class="small">Code, roles and delay</text><text x="73" y="412" class="small">still to verify</text>
<path class="solid" d="M215 425 V490"/><text x="236" y="465" class="small">owner()</text>
<path class="solid" d="M54 360 H23 V736 H49"/>
