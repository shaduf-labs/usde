<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc"><title id="title">Starting cooldown changes the claim</title><desc id="desc">sUSDe shares are burned when cooldown is confirmed. The fixed USDe amount waits in escrow without later vault rewards. Claiming returns USDe, not cash. Selling or redeeming USDe is separate.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#235e51"/></marker></defs><rect width="100%" height="100%" fill="#f8f7f2"/><g font-family="Arial,Helvetica,sans-serif" fill="#192d2b"><text x="20" y="34" font-size="25" font-weight="700">The share disappears before the wait ends</text><rect x="20" y="105" width="220" height="170" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="37" y="138" font-size="20" font-weight="700">1. Hold sUSDe</text><text x="37" y="172" font-size="17">Share count stays flat.</text><text x="37" y="198" font-size="17">Rewards change the</text><text x="37" y="224" font-size="17">USDe per share.</text><rect x="265" y="105" width="220" height="170" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="282" y="138" font-size="20" font-weight="700">2. Queued USDe</text><text x="282" y="172" font-size="17">Shares already burned.</text><text x="282" y="198" font-size="17">USDe amount fixed.</text><text x="282" y="224" font-size="17">No later vault rewards.</text><rect x="510" y="105" width="220" height="170" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="527" y="138" font-size="20" font-weight="700">3. Claim USDe</text><text x="527" y="172" font-size="17">After claim eligibility,</text><text x="527" y="198" font-size="17">submit the transaction.</text><text x="527" y="224" font-size="17">Receive USDe.</text><rect x="755" y="105" width="220" height="170" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="772" y="138" font-size="20" font-weight="700">4. Desired asset</text><text x="772" y="172" font-size="17">USDC, USDT or cash</text><text x="772" y="198" font-size="17">needs another route.</text><text x="772" y="224" font-size="17">Price and access matter.</text><path d="M240 190L259 190" stroke="#235e51" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M485 190L504 190" stroke="#235e51" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M730 190L749 190" stroke="#235e51" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="20" y="84" font-size="16">Cooldown transaction</text><text x="510" y="84" font-size="16">Claim transaction</text><text x="755" y="84" font-size="16">Separate sale / redemption</text><text x="20" y="315" font-size="19" font-weight="700">Adding another cooldown request resets the release time for the entire account’s queue.</text><text x="20" y="345" font-size="17">Source mechanics, not a live quote. A one-day observation is not a permanent promise.</text></g></svg>
