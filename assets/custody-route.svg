<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 635" role="img" aria-labelledby="title desc"><title id="title">Custody and usable funds are different stages</title><desc id="desc">Original assets can remain in custody while a separate trading ledger records exposure and unsettled profit. Before a payout, settlement, release conditions, transfer completion and the required asset must all be checked. The mirror is not another asset.</desc><rect width="100%" height="100%" fill="#f8f7f2"/><g font-family="Arial,Helvetica,sans-serif" fill="#192d2b"><text x="22" y="40" font-size="29" font-weight="700">Where it sits is not when it can pay.</text><rect x="22" y="85" width="420" height="175" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="40" y="119" font-size="21" font-weight="700">Original asset in custody</text><text x="40" y="153" font-size="17">May be locked or pledged.</text><text x="40" y="180" font-size="17">A custody balance is not always</text><text x="40" y="207" font-size="17">an amount available to withdraw.</text><rect x="558" y="85" width="420" height="175" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="576" y="119" font-size="21" font-weight="700">Exchange trading record</text><text x="576" y="153" font-size="17">Mirrored balance and PnL.</text><text x="576" y="180" font-size="17">An unsettled gain is a claim,</text><text x="576" y="207" font-size="17">not a second freely spendable asset.</text><path d="M445 135H549m-8 -6l8 6l-8 6" stroke="#235e51" stroke-width="2" stroke-dasharray="6 4" fill="none"/><text x="454" y="121" font-size="13">Mirror</text><path d="M551 222H450m8 -6l-8 6l8 6" stroke="#235e51" stroke-width="2" fill="none"/><text x="455" y="246" font-size="13">Net PnL*</text><text x="22" y="299" font-size="17">*Settlement can depend on exchange collateral and completed instructions.</text><text x="22" y="348" font-size="24" font-weight="700">Before treating the balance as usable funds:</text><rect x="22" y="380" width="220" height="142" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="40" y="414" font-size="21" font-weight="700">1. Settlement</text><text x="40" y="448" font-size="17">Check the relevant</text><text x="40" y="475" font-size="17">currency and status.</text><rect x="267" y="380" width="220" height="142" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="285" y="414" font-size="21" font-weight="700">2. Release</text><text x="285" y="448" font-size="17">Check encumbrance</text><text x="285" y="475" font-size="17">and account scope.</text><rect x="512" y="380" width="220" height="142" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="530" y="414" font-size="21" font-weight="700">3. Transfer</text><text x="530" y="448" font-size="17">Check completion,</text><text x="530" y="475" font-size="17">not just an order ID.</text><rect x="757" y="380" width="220" height="142" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="775" y="414" font-size="21" font-weight="700">4. Final asset</text><text x="775" y="448" font-size="17">Check what arrived</text><text x="775" y="475" font-size="17">before the deadline.</text><text x="22" y="571" font-size="19" font-weight="700">A free, timely buffer can bridge a delay. A trapped reserve cannot.</text><text x="22" y="605" font-size="16">Provider-described mechanisms, not a live Ethena balance sheet or a promised release clock.</text></g></svg>
