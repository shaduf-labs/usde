<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900" role="img" aria-labelledby="title desc"><title id="title">Starting cooldown changes the claim</title><desc id="desc">A vertical route: hold sUSDe; confirmed cooldown burns shares and fixes USDe; wait and claim USDe; use a separate route for another stablecoin or cash. Adding a request resets the entire queue timestamp.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#235e51"/></marker></defs><rect width="100%" height="100%" fill="#f8f7f2"/><g font-family="Arial,Helvetica,sans-serif" fill="#192d2b"><text x="18" y="32" font-size="24" font-weight="700">The share disappears</text><text x="18" y="65" font-size="24" font-weight="700">before the wait ends</text><rect x="18" y="100" width="364" height="133" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="35" y="133" font-size="20" font-weight="700">1. Hold sUSDe</text><text x="35" y="167" font-size="17">Share count stays flat.</text><text x="35" y="193" font-size="17">Rewards change USDe per share.</text><rect x="18" y="285" width="364" height="133" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="35" y="318" font-size="20" font-weight="700">2. Queued USDe</text><text x="35" y="352" font-size="17">Shares burned; USDe amount fixed.</text><text x="35" y="378" font-size="17">No later vault rewards.</text><rect x="18" y="470" width="364" height="133" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="35" y="503" font-size="20" font-weight="700">3. Claim USDe</text><text x="35" y="537" font-size="17">After eligibility, submit the claim.</text><text x="35" y="563" font-size="17">The returned asset is USDe.</text><rect x="18" y="655" width="364" height="133" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="35" y="688" font-size="20" font-weight="700">4. Desired asset</text><text x="35" y="722" font-size="17">USDC, USDT or cash: another route.</text><text x="35" y="748" font-size="17">Price, access and settlement matter.</text><path d="M200 236L200 276" stroke="#235e51" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="18" y="266" font-size="16">Confirmed cooldown</text><path d="M200 421L200 461" stroke="#235e51" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="18" y="452" font-size="16">Wait, then claim</text><path d="M200 606L200 646" stroke="#235e51" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="18" y="637" font-size="16">Separate route</text><text x="18" y="828" font-size="17" font-weight="700">Top-up warning: a new request resets</text><text x="18" y="854" font-size="17" font-weight="700">the release time for the whole queue.</text></g></svg>
