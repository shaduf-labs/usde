<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Where redemption becomes settlement</title><desc id="desc">Eligibility, quote and signature precede privileged submission. Inside one redemption transaction, USDe burns and collateral transfers; a reverting payout rolls back that transaction. Cash conversion is separate.</desc><rect width="100%" height="100%" fill="#f8f7f2"/><g font-family="Arial,Helvetica,sans-serif" fill="#192d2b"><text x="22" y="35" font-size="28" font-weight="700">A signature is not a payout.</text><rect x="22" y="70" width="296" height="142" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="38" y="101" font-size="20" font-weight="700">1. Eligibility and quote</text><text x="38" y="132" font-size="17">Issuer / API conditions.</text><text x="38" y="157" font-size="17">No payment established.</text><rect x="352" y="70" width="296" height="142" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="368" y="101" font-size="20" font-weight="700">2. Signed order</text><text x="368" y="132" font-size="17">Holder authorizes terms.</text><text x="368" y="157" font-size="17">Capacity is not reserved.</text><rect x="682" y="70" width="296" height="142" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="698" y="101" font-size="20" font-weight="700">3. Operator submission</text><text x="698" y="132" font-size="17">Privileged caller required.</text><text x="698" y="157" font-size="17">Rules and inventory matter.</text><path d="M320 140h26m-7 -5l7 5l-7 5M650 140h26m-7 -5l7 5l-7 5M829 217v32m-5 -7l5 7l5 -7" fill="none" stroke="#235e51" stroke-width="2.5"/><rect x="22" y="261" width="956" height="190" rx="5" fill="#e0ebe2" stroke="#235e51" stroke-width="2"/><text x="42" y="300" font-size="21" font-weight="700">INSIDE ONE AUTHORIZED REDEMPTION TRANSACTION</text><text x="42" y="345" font-size="26" font-weight="700">USDe burn → specified collateral payout</text><text x="42" y="387" font-size="20">A reverting payout rolls back this transaction’s burn, nonce and counters.</text><text x="42" y="423" font-size="18">This protection does not guarantee operator dispatch or available inventory.</text><text x="22" y="503" font-size="23" font-weight="700">Received collateral is still a token—not necessarily bank cash.</text><text x="22" y="541" font-size="19">Dollar value, exchange credit and bank settlement need their own evidence.</text><text x="22" y="592" font-size="17">Source map, not a live order, current permission check, executable quote or safety guarantee.</text></g></svg>
