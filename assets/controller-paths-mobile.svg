<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 780" role="img" aria-labelledby="title desc"><title id="title">Two controller source paths, not one universal delay</title><desc id="desc">Ordinary and whitelisted execution are different entry points. Current role membership, whitelist, minimum delay and upstream controllers remain unresolved.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#235e51"/></marker></defs><rect width="100%" height="100%" fill="#f8f7f2"/><g font-family="Arial,Helvetica,sans-serif" fill="#192d2b"><text x="18" y="32" font-size="24" font-weight="700">Two source paths.</text><text x="18" y="65" font-size="24" font-weight="700">Not one universal delay.</text><rect x="18" y="105" width="364" height="217" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="35" y="138" font-size="20" font-weight="700">Ordinary execution</text><text x="35" y="172" font-size="17">Executor role, or open executor gate</text><text x="35" y="198" font-size="17">Scheduled operation must be ready</text><text x="35" y="224" font-size="17">Predecessor must be complete</text><text x="35" y="250" font-size="17">Ordinary delay applies here.</text><rect x="18" y="356" width="364" height="217" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="35" y="389" font-size="20" font-weight="700">Whitelisted execution</text><text x="35" y="423" font-size="17">Special executor permission</text><text x="35" y="449" font-size="17">Allowed contract + function</text><text x="35" y="475" font-size="17">Whitelist does not fix input values</text><text x="35" y="501" font-size="17">No ordinary scheduling wait.</text><text x="18" y="619" font-size="17" font-weight="700">Both face the destination’s own checks.</text><text x="18" y="657" font-size="17">Current roles, whitelist, minimum delay</text><text x="18" y="683" font-size="17">and full controller links remain unknown</text><text x="18" y="709" font-size="17">at the common observation block.</text><text x="18" y="756" font-size="17" font-weight="700">Source map, not a live bypass finding.</text></g></svg>
