<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1020" role="img" aria-labelledby="title desc"><title id="title">Where redemption becomes settlement</title><desc id="desc">Eligibility, quote and signature precede privileged submission. Inside one redemption transaction, USDe burns and collateral transfers; a reverting payout rolls back that transaction. Cash conversion is separate.</desc><rect width="100%" height="100%" fill="#f8f7f2"/><g font-family="Arial,Helvetica,sans-serif" fill="#192d2b"><text x="18" y="32" font-size="24" font-weight="700">A signature is not a payout.</text><rect x="18" y="68" width="364" height="128" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="34" y="99" font-size="20" font-weight="700">1. Eligibility and quote</text><text x="34" y="130" font-size="17">Issuer / API conditions apply.</text><text x="34" y="155" font-size="17">No payment established yet.</text><path d="M200 200v27m-5 -7l5 7l5 -7" fill="none" stroke="#235e51" stroke-width="2.5"/><rect x="18" y="233" width="364" height="128" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="34" y="264" font-size="20" font-weight="700">2. Signed order</text><text x="34" y="295" font-size="17">The holder authorizes terms.</text><text x="34" y="320" font-size="17">Capacity is not reserved.</text><path d="M200 365v27m-5 -7l5 7l5 -7" fill="none" stroke="#235e51" stroke-width="2.5"/><rect x="18" y="398" width="364" height="128" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="34" y="429" font-size="20" font-weight="700">3. Operator submission</text><text x="34" y="460" font-size="17">A privileged caller is required.</text><text x="34" y="485" font-size="17">Rules and inventory still matter.</text><path d="M200 530v27m-5 -7l5 7l5 -7" fill="none" stroke="#235e51" stroke-width="2.5"/><rect x="18" y="567" width="364" height="228" rx="5" fill="#e0ebe2" stroke="#235e51" stroke-width="2"/><text x="34" y="601" font-size="18" font-weight="700">ONE ON-CHAIN TRANSACTION</text><text x="34" y="640" font-size="19" font-weight="700">USDe burn → collateral payout</text><text x="34" y="681" font-size="17">If the payout reverts, this</text><text x="34" y="707" font-size="17">transaction’s burn rolls back.</text><text x="34" y="759" font-size="17">Not a promise of submission.</text><path d="M200 800v28m-5 -7l5 7l5 -7" fill="none" stroke="#235e51" stroke-width="2.5"/><rect x="18" y="837" width="364" height="121" rx="5" fill="#edf1e9" stroke="#a8b9ab"/><text x="34" y="868" font-size="20" font-weight="700">4. Received token ≠ bank cash</text><text x="34" y="899" font-size="17">Price, venue and bank settlement</text><text x="34" y="924" font-size="17">remain separate conditions.</text><text x="18" y="996" font-size="17">Source map, not a live order or quote.</text></g></svg>
